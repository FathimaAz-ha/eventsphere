{% extends "base.html" %}
{% block title %}My Tickets{% endblock %}
{% block content %}
<h4>My Tickets</h4>
{% for t in tickets %}
<div class="card mb-3"><div class="card-body text-center">
  <h6 class="mb-1">{{ t.event_title }}</h6>
  <p class="small text-muted mb-1">Status: {{ t.status }}</p>
  <p class="small mb-2"><code>{{ t.code }}</code></p>
  <img src="{{ t.qr }}" alt="QR code" class="qr">
</div></div>
{% else %}
<p class="text-muted">No tickets yet. <a href="/events">Browse events</a>.</p>
{% endfor %}
{% endblock %}
