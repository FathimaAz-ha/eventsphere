{% extends "base.html" %}
{% block title %}Create Venue{% endblock %}
{% block content %}
<a href="/dashboard" class="btn btn-glass btn-sm mb-3">
  <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
</a>

<div class="glass-card">
  <div class="d-flex align-items-center gap-2 mb-3">
    <div class="p-2 rounded-3" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4);">
      <i class="bi bi-building-add text-primary fs-5"></i>
    </div>
    <div>
      <h5 class="mb-0 text-white">Add New Venue</h5>
      <span class="small text-subtle">Configure venue capacity and hiring availability</span>
    </div>
  </div>

  <form method="post" action="/admin/venue">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    
    <div class="mb-3">
      <label class="form-label">Venue Name</label>
      <input name="name" class="form-control" placeholder="e.g. Royal Exhibition Hall" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Location / Campus</label>
      <input name="location" class="form-control" placeholder="e.g. Building B, 3rd Floor" required>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-12 col-sm-6">
        <label class="form-label">Maximum Capacity</label>
        <input name="capacity" type="number" min="1" class="form-control" placeholder="e.g. 150" required>
      </div>
      <div class="col-12 col-sm-6">
        <label class="form-label">Hourly Rate (£)</label>
        <input name="hourly_rate" type="number" step="0.01" class="form-control" placeholder="50.00">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" placeholder="Venue facilities, audio/visual setup, rules..." rows="3"></textarea>
    </div>

    <div class="p-3 rounded-4 mb-4" style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" name="open_for_hire" value="1" id="openForHire" checked>
        <label class="form-check-label text-white small fw-bold" for="openForHire">
          Available for Private Hire
        </label>
        <span class="d-block small text-subtle" style="font-size: 0.75rem;">Allows VenueAgent to process private booking requests for this hall.</span>
      </div>
    </div>

    <button class="btn btn-primary w-100 py-2">
      <i class="bi bi-check2-circle me-1"></i> Register Venue
    </button>
  </form>
</div>
{% endblock %}
