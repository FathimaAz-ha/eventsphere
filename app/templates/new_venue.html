{% extends "base.html" %}
{% block title %}New venue{% endblock %}
{% block content %}
<h4>Create venue</h4>
<form method="post" action="/admin/venue" class="row g-2 mt-2">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="col-md-6"><input name="name" class="form-control" placeholder="Name" required></div>
  <div class="col-md-6"><input name="location" class="form-control" placeholder="Location" required></div>
  <div class="col-md-4"><input name="capacity" type="number" min="1" class="form-control" placeholder="Capacity" required></div>
  <div class="col-md-4"><input name="hourly_rate" type="number" step="0.01" class="form-control" placeholder="Rate/hr"></div>
  <div class="col-md-4"><label class="form-check form-switch mt-2">
    <input type="checkbox" name="open_for_hire" value="1" class="form-check-input"> Open for hire</label></div>
  <div class="col-12"><textarea name="description" class="form-control" placeholder="Description" rows="2"></textarea></div>
  <div class="col-12"><button class="btn btn-primary">Create venue</button></div>
</form>
{% endblock %}
