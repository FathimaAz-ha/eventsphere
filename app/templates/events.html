{% extends "base.html" %}
{% block title %}Events{% endblock %}
{% block content %}
<h4>Events</h4>
<form class="row g-2 mb-3" method="get" action="/events">
  <div class="col-7"><input name="q" class="form-control" placeholder="Search" value="{{ q or '' }}"></div>
  <div class="col-3">
    <select name="category" class="form-select">
      <option value="">All</option>
      {% for c in ['concert','workshop','seminar','conference'] %}
      <option value="{{ c }}" {% if category==c %}selected{% endif %}>{{ c|title }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-2"><button class="btn btn-outline-secondary w-100">Go</button></div>
</form>
{% for e in events %}
<a href="/events/{{ e.id }}" class="text-decoration-none text-dark">
  <div class="card mb-2"><div class="card-body py-2">
    <h6 class="mb-1">{{ e.title }}</h6>
    <div class="small text-muted">
      {{ e.category|title }} · {{ e.starts_at.strftime('%d %b %H:%M') }} · {{ e.status }}
    </div>
  </div></div>
</a>
{% else %}
<p class="text-muted">No events match.</p>
{% endfor %}
{% endblock %}
