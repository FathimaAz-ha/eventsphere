{% extends "base.html" %}
{% block title %}New event{% endblock %}
{% block content %}
<h4>Create event</h4>
<form method="post" action="/admin/event" class="row g-2 mt-2">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="col-12"><input name="title" class="form-control" placeholder="Title" required></div>
  <div class="col-md-6">
    <select name="category" class="form-select" required>
      {% for c in ['concert','workshop','seminar','conference'] %}
      <option value="{{ c }}">{{ c|title }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <select name="venue_id" class="form-select" required>
      {% for v in venues %}
      <option value="{{ v.id }}">{{ v.name }} (cap {{ v.capacity }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6"><label class="small text-muted">Starts</label>
    <input name="starts_at" type="datetime-local" class="form-control" required></div>
  <div class="col-md-6"><label class="small text-muted">Ends</label>
    <input name="ends_at" type="datetime-local" class="form-control" required></div>
  <div class="col-12"><textarea name="description" class="form-control" placeholder="Description" rows="2"></textarea></div>
  <div class="col-md-5"><input name="ticket_name" class="form-control" placeholder="Category name" value="Standard"></div>
  <div class="col-md-3"><input name="ticket_price" type="number" step="0.01" class="form-control" placeholder="Price" value="10"></div>
  <div class="col-md-4"><input name="ticket_quantity" type="number" min="1" class="form-control" placeholder="Quantity" required></div>
  <div class="col-12"><button class="btn btn-primary">Create &amp; publish</button></div>
</form>
{% endblock %}
