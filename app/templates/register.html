{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h4>Create account</h4>
<form method="post" action="/register" class="mt-3">
  <div class="mb-2"><label class="form-label">Name</label>
    <input name="name" class="form-control" required></div>
  <div class="mb-2"><label class="form-label">Email</label>
    <input name="email" type="email" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Password (min 6)</label>
    <input name="password" type="password" class="form-control" required minlength="6"></div>
  <button class="btn btn-primary w-100">Create</button>
</form>
{% endblock %}
