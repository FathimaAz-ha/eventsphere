{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="glass-card mt-3">
  <div class="text-center mb-4">
    <div class="d-inline-flex p-3 rounded-circle mb-2"
      style="background: rgba(236, 72, 153, 0.2); border: 1px solid rgba(236, 72, 153, 0.4);">
      <i class="bi bi-person-plus fs-2" style="color: #f472b6;"></i>
    </div>
    <h4 class="mb-1">Create Account</h4>
    <p class="text-subtle small mb-0">Join EventSphere to discover and book venues</p>
  </div>

  <form method="post" action="/register">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input name="name" class="form-control" placeholder="John Doe" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input name="email" type="email" class="form-control" placeholder="name@domain.com" required>
    </div>
    <div class="mb-4">
      <label class="form-label">Password <span class="text-subtle font-normal">(min 6 characters)</span></label>
      <input name="password" type="password" class="form-control" placeholder="••••••••" required minlength="6">
    </div>
    <button class="btn btn-primary w-100 py-2 mb-3">
      <i class="bi bi-check2-circle me-1"></i> Register &amp; Explore
    </button>
  </form>

  <div class="text-center small text-subtle">
    Already have an account? <a href="/login" class="text-decoration-none"
      style="color: #c084fc; font-weight: 600;">Sign in</a>
  </div>
</div>
{% endblock %}
