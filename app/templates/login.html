{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="glass-card mt-3">
  <div class="text-center mb-4">
    <h4 class="mb-1">Sign in</h4>
    <p class="text-subtle small mb-0">Enter your credentials to continue</p>
  </div>

  <form method="post" action="/login" id="loginForm">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input name="email" id="emailInput" type="email" class="form-control" placeholder="name@domain.com" required>
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input name="password" id="passwordInput" type="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button class="btn btn-primary w-100 py-2 mb-3">
      Sign in
    </button>
  </form>

  <div class="text-center small text-subtle mb-3">
    Don't have an account? <a href="/register" class="text-decoration-none" style="color: #c084fc; font-weight: 600;">Register</a>
  </div>

  <div class="p-3 rounded-4" style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);">
    <div class="mb-2">
      <span class="small text-subtle font-monospace" style="font-size: 0.75rem;">DEMO ACCOUNTS</span>
    </div>
    <div class="d-flex flex-column gap-2">
      <button type="button" class="btn btn-glass py-2 px-3 d-flex justify-content-between align-items-center text-start"
              onclick="fillCreds('admin@eventsphere.local', 'admin123')">
        <span class="small fw-semibold text-white">Admin</span>
        <span class="small font-monospace text-subtle">admin@eventsphere.local</span>
      </button>
      <button type="button" class="btn btn-glass py-2 px-3 d-flex justify-content-between align-items-center text-start"
              onclick="fillCreds('staff@eventsphere.local', 'staff123')">
        <span class="small fw-semibold text-white">Gate Staff</span>
        <span class="small font-monospace text-subtle">staff@eventsphere.local</span>
      </button>
      <button type="button" class="btn btn-glass py-2 px-3 d-flex justify-content-between align-items-center text-start"
              onclick="fillCreds('demo@eventsphere.local', 'demo1234')">
        <span class="small fw-semibold text-white">Attendee</span>
        <span class="small font-monospace text-subtle">demo@eventsphere.local</span>
      </button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function fillCreds(email, password) {
  document.getElementById("emailInput").value = email;
  document.getElementById("passwordInput").value = password;
  document.getElementById("loginForm").submit();
}
</script>
{% endblock %}
