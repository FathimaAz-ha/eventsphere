services:
  - type: web
    name: eventsphere
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: eventsphere-db
    plan: free
    databaseName: eventsphere
    region: frankfurt